
<div class="header-container">
    <div class="logo-container">
        <img src="https://i.imgur.com/YourLogoURL.png" alt="Logo Heladería" width="120px">
    </div>
    <div class="title-container">
        <h1 class="main-title">Sistema de Gestión Netward</h1>
        <p class="subtitle">Control de Inventario y Delivery para Heladerías</p>
    </div>
    <div class="info-container">
        <div class="info-item">
            <span class="info-icon">📆</span>
            <span class="info-text" id="current-date"></span>
        </div>
        <div class="info-item">
            <span class="info-icon">⏱️</span>
            <span class="info-text" id="current-time"></span>
        </div>
    </div>
</div>

<script>
    // Función para actualizar la fecha y hora
    function updateDateTime() {
        const now = new Date();
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = now.toLocaleDateString('es-ES', dateOptions);
        
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
        document.getElementById('current-time').textContent = now.toLocaleTimeString('es-ES', timeOptions);
    }
    
    // Actualizar fecha/hora al cargar y cada segundo
    updateDateTime();
    setInterval(updateDateTime, 1000);
</script>

<style>
.header-container {
    display: flex;
    align-items: center;
    background-color: #f0f8ff;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.logo-container {
    flex: 1;
    text-align: center;
}

.title-container {
    flex: 3;
    text-align: center;
}

.main-title {
    color: #0066ff;
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    font-style: italic;
}

.info-container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.info-item {
    display: flex;
    align-items: center;
    margin: 5px 0;
}

.info-icon {
    margin-right: 8px;
    font-size: 1.2em;
}

.info-text {
    font-size: 0.9em;
    color: #555;
}

</style>
